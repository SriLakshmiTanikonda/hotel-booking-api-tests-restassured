name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite to run'
        type: choice
        options: [regression, smoke]
        default: regression

permissions:
  contents: read
  checks: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run ${{ github.event.inputs.suite || 'regression' }} suite
        run: mvn -B test -Dsuite=${{ github.event.inputs.suite || 'regression' }}

      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report
          path: target/surefire-reports/
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: API test results
